services:
  postgres:
    image: postgres:16-alpine
    container_name: ruralcare-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruralcare
    volumes:
      - ruralcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruralcare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ruralcare_pgdata:
    driver: local

